server:
  port: 8083

spring:
  application:
    name: cinema-service

  # Cấu hình PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/cinema_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  # Cấu hình JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Cấu hình Redis Cache
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

# Cấu hình Eureka Client
eureka:
  instance:
    hostname: localhost
    lease-expiration-duration-in-seconds: 10
    lease-renewal-interval-in-seconds: 3
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/