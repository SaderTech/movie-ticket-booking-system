server:
  port: 8085

spring:
  application:
    name: BOOKING-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: postgres
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.type.mapping: >
          seatHoldCreatedEvent:com.movieticket.bookingservice.infrastructure.kafka.event.SeatHoldCreatedEvent,
          seatHoldExpiredEvent:com.movieticket.bookingservice.infrastructure.kafka.event.SeatHoldExpiredEvent,
          bookingConfirmedEvent:com.movieticket.bookingservice.infrastructure.kafka.event.BookingConfirmedEvent,
          ticketBookedEvent:com.movieticket.bookingservice.infrastructure.kafka.event.TicketBookedEvent,
          bookingCancelledEvent:com.movieticket.bookingservice.infrastructure.kafka.event.BookingCancelledEvent
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: BASIC

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  redis:
    embedded:
      enabled: ${APP_REDIS_EMBEDDED_ENABLED:false}
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    outbox:
      poll-interval: 5000

vnpay:
  tmn-code: ${VNP_TMN_CODE:TU8GEVIB}
  hash-secret: ${VNP_HASH_SECRET}
  url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8085/api/bookings/vnpay-return
  allowed-return-hosts: localhost,127.0.0.1

logging:
  level:
    com.movieticket.bookingservice: DEBUG
    org.springframework.kafka: INFO
    org.redisson: INFO
    org.hibernate.SQL: DEBUG
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
